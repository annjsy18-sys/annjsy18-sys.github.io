<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>studio 모바일 390px 확인용 임시 프레임</title>
<style>
html,body{margin:0;background:#e5e7eb;font:12px/1.4 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
.row{display:flex;gap:14px;padding:14px;align-items:flex-start}
figure{margin:0;background:#fff;border:1px solid #cbd5e1;border-radius:12px;overflow:hidden}
figcaption{padding:6px 10px;font-weight:700;color:#334155;background:#f1f5f9;border-bottom:1px solid #e2e8f0}
iframe{display:block;width:390px;height:844px;border:0}
</style></head>
<body>
<div class="row" id="row"></div>
<script>
var P = new URLSearchParams(location.search);
var q = P.get('t') || 'preset';
var y = Number(P.get('y') || 0);
document.getElementById('row').innerHTML = q.split(',').map(function(t){
  return '<figure><figcaption>' + t + ' · 390px' + (y ? ' · y=' + y : '') + '</figcaption>' +
    '<iframe src="index.html?v=' + Date.now() + '#' + t + '" loading="eager" title="' + t + '"></iframe></figure>';
}).join('');
if(y){
  setTimeout(function(){
    Array.prototype.forEach.call(document.querySelectorAll('iframe'), function(f){
      try{ f.contentWindow.scrollTo(0, y); }catch(e){}
    });
  }, 900);
}
</script>
</body></html>
