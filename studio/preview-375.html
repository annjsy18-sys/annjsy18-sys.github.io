<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>studio 모바일 375 검증</title>
<style>
  html,body{margin:0;background:#0f172a;font:12px/1.4 system-ui,sans-serif;color:#e2e8f0}
  .wrap{display:flex;justify-content:center;padding:0}
  .phone{width:375px;background:#fff;overflow:hidden;position:relative}
  .cap{position:absolute;top:0;left:0;z-index:2;background:#0f172a;color:#fff;font-weight:700;padding:3px 8px;border-radius:0 0 6px 0}
  iframe{display:block;width:375px;border:0;background:#fff}
</style>
</head>
<body>
<div class="wrap"><div class="phone" id="phone"><span class="cap">375px</span>
<iframe id="fr" src="./index.html?v=pre375" title="studio 375"></iframe></div></div>
<script>
  var h = Number(new URLSearchParams(location.search).get('h') || 800);
  var y = Number(new URLSearchParams(location.search).get('y') || 0);
  var fr = document.getElementById('fr');
  fr.style.height = h + 'px';
  fr.src = './index.html?v=' + Date.now();
  fr.addEventListener('load', function(){
    try { fr.contentWindow.scrollTo(0, y); } catch(e){}
  });

  if (new URLSearchParams(location.search).get('demo')) {
    window.addEventListener('load', function(){
      setTimeout(function(){
        try {
          var d = fr.contentDocument;
          var u = d.getElementById('ocUrl');
          u.value = 'https://www.youtube.com/watch?v=aqz-KE-bpKQ';
          u.dispatchEvent(new Event('input', {bubbles:true}));
          d.getElementById('ocStart').value = '12';
          d.getElementById('ocStart').dispatchEvent(new Event('input', {bubbles:true}));
          d.getElementById('ocBuild').click();
        } catch(e){}
      }, 250);
    });
  }
</script>
</body>
</html>
