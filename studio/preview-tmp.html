<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>화면 미리보기</title>
<style>
html,body{margin:0;background:#e2e8f0;font:13px/1.5 -apple-system,"Malgun Gothic",sans-serif}
body{padding:8px}
.lbl{padding:4px 2px 6px;font-weight:800;color:#334155}
iframe{border:1px solid #94a3b8;background:#fff;display:block}
</style>
</head>
<body>
<div class="lbl" id="lbl"></div>
<iframe id="fr" title="preview"></iframe>
<script>
var q = new URLSearchParams(location.search);
var w = parseInt(q.get('w')||'375', 10);
var h = parseInt(q.get('h')||'812', 10);
var anchor = q.get('a') || '';
document.getElementById('lbl').textContent = w + '×' + h + (anchor ? ' · #' + anchor : '');
var fr = document.getElementById('fr');
fr.style.width = w + 'px';
fr.style.height = h + 'px';
fr.src = 'index.html?v=' + (q.get('v')||'9') + (anchor ? '#' + anchor : '');
</script>
</body>
</html>
