<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>mobile check</title>
<style>html,body{margin:0;background:#e2e8f0}iframe{width:390px;height:1400px;border:0;display:block;margin:0 auto;background:#fff}</style>
</head><body>
<iframe id="f"></iframe>
<script>
var f = document.getElementById('f');
f.src = './?v=' + Date.now();
f.addEventListener('load', function(){
  var d = this.contentDocument;
  if(!d) return;
  var el = d.getElementById('moveCard');
  if(el) el.scrollIntoView();
});
</script>
</body></html>
