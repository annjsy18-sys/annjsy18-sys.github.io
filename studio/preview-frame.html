<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>검증 프레임</title>
<style>
  body{margin:0;padding:8px;background:#0f172a;color:#e2e8f0;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;font-size:13px}
  #stage{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
  .box{background:#1e293b;border:1px solid #334155;border-radius:10px;padding:8px}
  .cap{font-size:12px;color:#94a3b8;margin:0 0 6px}
  iframe{border:0;background:#fff;display:block}
  pre{background:#1e293b;border:1px solid #334155;border-radius:10px;padding:10px;white-space:pre-wrap;font-size:12px;color:#a7f3d0;max-width:900px}
</style>
</head>
<body>
<div id="stage"></div>
<pre id="out">측정 중…</pre>
<script>
(function(){
  var p = new URLSearchParams(location.search);
  var w = Number(p.get('w') || 375);
  var h = Number(p.get('h') || 812);
  var tab = p.get('tab') || '';
  var y = Number(p.get('y') || 0);
  var mock = p.get('mock') === '1';
  var src = 'preview-tabs.html?v=' + Date.now() + (tab ? ('#' + tab) : '');
  var stage = document.getElementById('stage');
  stage.innerHTML = '<div class="box"><p class="cap">' + w + ' × ' + h + (tab ? (' · ' + tab) : '') + (mock ? ' · 샘플 데이터' : '') + '</p>' +
    '<iframe id="fr" src="' + src + '" width="' + w + '" height="' + h + '" style="width:' + w + 'px;height:' + h + 'px"></iframe></div>';
  var fr = document.getElementById('fr');

  function installMock(win){
    var now = Date.now();
    var chans = [
      {id:'UCa', name:'살림하는 남자', subs:'12000'},
      {id:'UCb', name:'주방의 발견', subs:'340000'},
      {id:'UCc', name:'하루살림', subs:'890000'},
      {id:'UCd', name:'작은집 큰살림', subs:'5400', hidden:true},
      {id:'UCe', name:'겨울준비', subs:'61000'}
    ];
    var vids = [
      {id:'aaaaaaaaaaa', t:'성에 10초에 지우는 법 (겨울 아침 필수)', c:'UCa', v:186000, d:'PT38S', days:3},
      {id:'bbbbbbbbbbb', t:'앞유리 성에, 절대 긁지 마세요', c:'UCb', v:2400000, d:'PT52S', days:9},
      {id:'ccccccccccc', t:'차 안 습기 한 번에 잡는 3가지', c:'UCc', v:980000, d:'PT58S', days:17},
      {id:'ddddddddddd', t:'성에 제거 스프레이 직접 만들어봤습니다', c:'UCd', v:41200, d:'PT44S', days:5},
      {id:'eeeeeeeeeee', t:'겨울 차량 관리, 이 3개만 하세요', c:'UCe', v:152000, d:'PT47S', days:22},
      {id:'fffffffffff', t:'성에 제거 15분 걸리는 방법 (비추천)', c:'UCc', v:22000, d:'PT95S', days:6}
    ];
    var svg = '<svg xmlns="http://www.w3.org/2000/svg" width="320" height="180"><rect width="320" height="180" fill="#cbd5e1"/><text x="160" y="95" font-family="sans-serif" font-size="20" fill="#475569" text-anchor="middle">샘플</text></svg>';
    var thumb = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
    win.fetch = function(url){
      var u = String(url), body;
      if(u.indexOf('/search?') > -1){
        body = {items: vids.map(function(v){ return {id:{videoId:v.id}}; })};
      } else if(u.indexOf('/videos?') > -1){
        body = {items: vids.map(function(v){
          var c = chans.filter(function(x){ return x.id === v.c; })[0];
          return {id:v.id, snippet:{title:v.t, channelId:v.c, channelTitle:c.name, publishedAt:new Date(now - v.days*86400000).toISOString(), thumbnails:{medium:{url:thumb}}}, statistics:{viewCount:String(v.v), likeCount:'1200'}, contentDetails:{duration:v.d}};
        })};
      } else if(u.indexOf('/channels?') > -1){
        body = {items: chans.map(function(c){ return {id:c.id, statistics: c.hidden ? {hiddenSubscriberCount:true} : {subscriberCount:c.subs}}; })};
      } else { body = {items:[]}; }
      return Promise.resolve({ok:true, status:200, json:function(){ return Promise.resolve(body); }});
    };
    var d = win.document;
    d.getElementById('ytQ').value = '성에 제거';
    setTimeout(function(){ d.getElementById('pxGo').click(); }, 200);
  }

  fr.addEventListener('load', function(){
    try{
      if(mock) installMock(fr.contentWindow);
    }catch(e){}
    setTimeout(function(){
      try{
        if(y) fr.contentWindow.scrollTo(0, y);
        var d = fr.contentDocument;
        var de = d.documentElement;
        var over = [];
        var all = d.querySelectorAll('body *');
        for(var i = 0; i < all.length; i++){
          var el = all[i];
          var st = fr.contentWindow.getComputedStyle(el);
          if(st.display === 'none' || st.visibility === 'hidden') continue;
          var r = el.getBoundingClientRect();
          if(r.width > 0 && (r.right > w + 0.5 || r.left < -0.5)){
            over.push(el.tagName.toLowerCase() + (el.id ? ('#' + el.id) : '') +
              (typeof el.className === 'string' && el.className ? ('.' + el.className.split(' ')[0]) : '') +
              ' [' + Math.round(r.left) + '→' + Math.round(r.right) + ']');
          }
        }
        document.getElementById('out').textContent = JSON.stringify({
          viewport: w + 'x' + h,
          scrollY: Math.round(fr.contentWindow.scrollY || 0),
          docScrollWidth: de.scrollWidth,
          docClientWidth: de.clientWidth,
          bodyScrollWidth: d.body.scrollWidth,
          horizontalOverflow: de.scrollWidth - de.clientWidth,
          overflowingCount: over.length,
          overflowing: over.slice(0, 15)
        }, null, 2);
      }catch(e){
        document.getElementById('out').textContent = 'ERR ' + e.message;
      }
    }, 1200);
  });
})();
</script>
</body>
</html>
